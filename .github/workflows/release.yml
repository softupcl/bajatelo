name: 'release'
# Workflow oficial de Tauri (docs → Distribute/pipelines) adaptado a Bajatelo.
# Genera DMG (macOS), NSIS (Windows), DEB/AppImage (Linux) en runners nativos.
# Publica un DRAFT release con los instaladores; publicarlo final es manual.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1+)
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: download pinned engines (yt-dlp 2026.08.19 + FFmpeg 9.0.2 — D-09/C)
        run: |
          case "${{ matrix.platform }}" in
            macos-latest) PLATFORM="darwin-aarch64" ;;
            windows-latest) PLATFORM="windows-x86_64" ;;
            ubuntu-22.04) PLATFORM="linux-x86_64" ;;
          esac
          bash scripts/fetch-engines.sh "$PLATFORM"
          cat "src-tauri/engines/$PLATFORM/MANIFEST.txt"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bajatelo v__VERSION__'
          releaseBody: 'Descarga el instalador para tu sistema. Sin yt-dlp ni FFmpeg incrustados: la app los detecta y guía su instalación (README).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
